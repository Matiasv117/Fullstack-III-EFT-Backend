version: '3.8'

services:
  db-auth:
    image: postgres:16
    container_name: db-auth
    environment:
      POSTGRES_DB: ms_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - salud-network

  db-gestionpacientes:
    image: postgres:16
    container_name: db-gestionpacientes
    environment:
      POSTGRES_DB: ms_gestionpacientes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata-gestionpacientes:/var/lib/postgresql/data
    networks:
      - salud-network

  db-optimizacion:
    image: postgres:16
    container_name: db-optimizacion
    environment:
      POSTGRES_DB: ms_optimizacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata-optimizacion:/var/lib/postgresql/data
    networks:
      - salud-network

  db-notificaciones:
    image: postgres:16
    container_name: db-notificaciones
    environment:
      POSTGRES_DB: ms_notificaciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata-notificaciones:/var/lib/postgresql/data
    networks:
      - salud-network

  db-progreso:
    image: postgres:16
    container_name: db-progreso
    environment:
      POSTGRES_DB: ms_progreso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - pgdata-progreso:/var/lib/postgresql/data
    networks:
      - salud-network

  db-auditoria:
    image: postgres:16
    container_name: db-auditoria
    environment:
      POSTGRES_DB: ms_auditoria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - pgdata-auditoria:/var/lib/postgresql/data
    networks:
      - salud-network

  # Infraestructura
  redis:
    image: redis:7-alpine
    container_name: salud-redis
    ports:
      - "6379:6379"
    networks:
      - salud-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: salud-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - salud-network

  # Eureka Server
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - salud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - salud-network

  # Microservicios
  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db-auth:5432/ms_auth
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-auth:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  ms-gestionpacientes:
    build:
      context: ./ms-gestionpacientes
      dockerfile: Dockerfile
    container_name: ms-gestionpacientes
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db-gestionpacientes:5432/ms_gestionpacientes
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-gestionpacientes:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - salud-network

  ms-optimizacion:
    build:
      context: ./ms-optimizacion
      dockerfile: Dockerfile
    container_name: ms-optimizacion
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db-optimizacion:5432/ms_optimizacion
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-optimizacion:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: ms-notificaciones
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db-notificaciones:5432/ms_notificaciones
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-notificaciones:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  ms-progreso:
    build:
      context: ./ms-progreso
      dockerfile: Dockerfile
    container_name: ms-progreso
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db-progreso:5432/ms_progreso
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-progreso:
        condition: service_started
    networks:
      - salud-network

  ms-auditoria:
    build:
      context: ./ms-auditoria
      dockerfile: Dockerfile
    container_name: ms-auditoria
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db-auditoria:5432/ms_auditoria
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-auditoria:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: bff
    ports:
      - "8097:8097"
    environment:
      - BFF_DOWNSTREAM_BASE_URL=http://api-gateway:8080
      - BFF_AUTH_BASE_URL=http://ms-auth:8087
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      api-gateway:
        condition: service_started
      ms-auth:
        condition: service_started
    networks:
      - salud-network

networks:
  salud-network:
    driver: bridge

volumes:
  pgdata-auth:
  pgdata-gestionpacientes:
  pgdata-optimizacion:
  pgdata-notificaciones:
  pgdata-progreso:
  pgdata-auditoria:
