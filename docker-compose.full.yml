services:
  # Infraestructura
  redis:
    image: redis:7-alpine
    container_name: salud-redis
    ports:
      - "6379:6379"
    networks:
      - salud-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: salud-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - salud-network

  # Eureka Server
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - salud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - salud-network

  # Microservicios
  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://ep-autumn-truth-adfu20rc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_bYcXjIfp0av3
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  ms-gestionpacientes:
    build:
      context: ./ms-gestionpacientes
      dockerfile: Dockerfile
    container_name: ms-gestionpacientes
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://ep-autumn-truth-adfu20rc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_bYcXjIfp0av3
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - salud-network

  ms-optimizacion:
    build:
      context: ./ms-optimizacion
      dockerfile: Dockerfile
    container_name: ms-optimizacion
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://ep-autumn-truth-adfu20rc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_bYcXjIfp0av3
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: ms-notificaciones
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://ep-autumn-truth-adfu20rc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_bYcXjIfp0av3
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  ms-progreso:
    build:
      context: ./ms-progreso
      dockerfile: Dockerfile
    container_name: ms-progreso
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://ep-autumn-truth-adfu20rc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_bYcXjIfp0av3
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - salud-network

  ms-auditoria:
    build:
      context: ./ms-auditoria
      dockerfile: Dockerfile
    container_name: ms-auditoria
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://ep-autumn-truth-adfu20rc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_bYcXjIfp0av3
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - salud-network

  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: bff
    ports:
      - "8097:8097"
    environment:
      - BFF_DOWNSTREAM_BASE_URL=http://api-gateway:8080
      - BFF_AUTH_BASE_URL=http://ms-auth:8087
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      api-gateway:
        condition: service_started
      ms-auth:
        condition: service_started
    networks:
      - salud-network

networks:
  salud-network:
    driver: bridge
