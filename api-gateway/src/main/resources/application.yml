server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 10MB
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: salud-bff
          uri: lb://salud-bff
          predicates:
            - Path=/api/portal/**
          filters:
            - StripPrefix=0

        - id: ms-listas-espera
          uri: lb://ms-listas-espera
          predicates:
            - Path=/api/listas-espera/**,/lista-espera/**,/pacientes/**
          filters:
            - StripPrefix=0

        - id: ms-notificaciones
          uri: lb://ms-notificaciones
          predicates:
            - Path=/api/notificaciones/**
          filters:
            - StripPrefix=0

        - id: ms-optimizacion
          uri: lb://ms-optimizacion
          predicates:
            - Path=/optimizacion/**,/citas/**,/medicos/**,/horarios/**
          filters:
            - StripPrefix=0

        - id: ms-progreso
          uri: lb://ms-progreso
          predicates:
            - Path=/progreso/**
          filters:
            - StripPrefix=0

        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: ms-auditoria
          uri: lb://ms-auditoria
          predicates:
            - Path=/api/auditoria/**
          filters:
            - StripPrefix=0

jwt:
  secret: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true
