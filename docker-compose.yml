services:
  # ── Frontend (React + Nginx) ──
  frontend:
    build:
      context: ./Fullstack-III-EFT-Frontend
      dockerfile: Dockerfile
    container_name: insforge-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - insforge-net

  # ── PostgreSQL (base de datos local) ──
  postgres:
    image: postgres:16-alpine
    container_name: insforge-postgres
    environment:
      POSTGRES_DB: neondb
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_Viz5aYF6NSuO
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d neondb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - insforge-net

  # ── Mailpit ( SMTP local para notificaciones) ──
  mailpit:
    image: axllent/mailpit:latest
    container_name: insforge-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - insforge-net

  # ── API Gateway ──
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: insforge-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      JWT_SECRET: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte
      MS_LISTAS_ESPERA_URL: http://ms-gestionpacientes:8083
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8085
      MS_OPTIMIZACION_URL: http://ms-optimizacion:8084
      MS_AUTH_URL: http://ms-auth:8087
    depends_on:
      ms-auth:
        condition: service_started
      ms-gestionpacientes:
        condition: service_started
    networks:
      - insforge-net

  # ── ms-auth ──
  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: insforge-ms-auth
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/neondb?sslmode=disable
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_Viz5aYF6NSuO
      JWT_SECRET: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte
      MS_LISTAS_ESPERA_URL: http://ms-gestionpacientes:8083
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insforge-net

  # ── ms-gestionpacientes ──
  ms-gestionpacientes:
    build:
      context: ./ms-gestionpacientes
      dockerfile: Dockerfile
    container_name: insforge-ms-gestionpacientes
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/neondb?sslmode=disable
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_Viz5aYF6NSuO
      JWT_SECRET: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte
      MS_OPTIMIZACION_URL: http://ms-optimizacion:8084
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insforge-net

  # ── ms-optimizacion ──
  ms-optimizacion:
    build:
      context: ./ms-optimizacion
      dockerfile: Dockerfile
    container_name: insforge-ms-optimizacion
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/neondb?sslmode=disable
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_Viz5aYF6NSuO
      JWT_SECRET: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte
      MS_LISTAS_ESPERA_URL: http://ms-gestionpacientes:8083
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insforge-net

  # ── ms-notificaciones ──
  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: insforge-ms-notificaciones
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/neondb?sslmode=disable
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_Viz5aYF6NSuO
      JWT_SECRET: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - insforge-net

volumes:
  postgres_data:

networks:
  insforge-net:
    driver: bridge
