services:
  redis:
    image: redis:7-alpine
    container_name: salud-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: salud-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mailpit:
    image: axllent/mailpit:latest
    container_name: salud-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"


