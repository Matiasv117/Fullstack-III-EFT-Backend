name: Build, Push & Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: insforge-cluster

permissions:
  id-token: write
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # BACKEND SERVICES (9 services in parallel)
  # ──────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: eureka-server
            port: 8761
            cpu: 512
            memory: 1024
          - name: api-gateway
            port: 8080
            cpu: 512
            memory: 1024
          - name: bff
            port: 8097
            cpu: 512
            memory: 1024
          - name: ms-auth
            port: 8087
            cpu: 256
            memory: 512
          - name: ms-gestionpacientes
            port: 8083
            cpu: 256
            memory: 512
          - name: ms-optimizacion
            port: 8084
            cpu: 256
            memory: 512
          - name: ms-notificaciones
            port: 8085
            cpu: 256
            memory: 512
          - name: ms-progreso
            port: 8086
            cpu: 256
            memory: 512
          - name: ms-auditoria
            port: 8088
            cpu: 256
            memory: 512

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -q
        working-directory: ${{ matrix.service.name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: ${{ matrix.service.name }}
        run: |
          IMAGE="${ECR_REGISTRY}/${{ matrix.service.name }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service.name }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  # ──────────────────────────────────────────────
  # INFRA SERVICES (Redis + RabbitMQ)
  # ──────────────────────────────────────────────
  build-infra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: redis
            image: redis:7-alpine
            port: 6379
            cpu: 256
            memory: 512
          - name: rabbitmq
            image: rabbitmq:3-management-alpine
            port: 5672
            cpu: 512
            memory: 1024

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and retag infrastructure image
        run: |
          docker pull ${{ matrix.service.image }}
          IMAGE="${ECR_REGISTRY}/${{ matrix.service.name }}:${{ github.sha }}"
          docker tag ${{ matrix.service.image }} "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service.name }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  # ──────────────────────────────────────────────
  # FRONTEND
  # ──────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Fullstack-III-EFT-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Fullstack-III-EFT-Frontend

      - name: Run tests
        run: npm test -- --run
        working-directory: Fullstack-III-EFT-Frontend

      - name: Run linter
        run: npm run lint
        working-directory: Fullstack-III-EFT-Frontend

      - name: Build
        run: npm run build
        working-directory: Fullstack-III-EFT-Frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: Fullstack-III-EFT-Frontend
        run: |
          IMAGE="${ECR_REGISTRY}/frontend:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service frontend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  # ──────────────────────────────────────────────
  # POST-DEPLOY SMOKE TEST
  # ──────────────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-infra]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for services to stabilize
        run: sleep 120

      - name: Get ALB DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names insforge-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Health check - Frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ steps.alb.outputs.alb_dns }}/)
          if [ "$STATUS" != "200" ]; then
            echo "Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "Frontend OK (HTTP $STATUS)"

      - name: Health check - API Gateway
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ steps.alb.outputs.alb_dns }}/api/actuator/health)
          if [ "$STATUS" != "200" ]; then
            echo "API Gateway health check failed with status $STATUS"
            exit 1
          fi
          echo "API Gateway OK (HTTP $STATUS)"

      - name: Smoke test - Login
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            http://${{ steps.alb.outputs.alb_dns }}/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Login failed with status $HTTP_CODE: $BODY"
            exit 1
          fi
          echo "Login OK: $BODY"
