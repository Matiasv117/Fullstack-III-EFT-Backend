name: InsForge RedNorte - CI/CD Pipeline

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER_NAME: insforge-manual
  NAMESPACE: insforge

jobs:
  # ──────────────────────────────────────────────
  # ETAPA 1: Tests Backend
  # ──────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
          - name: ms-auth
            path: ms-auth
          - name: ms-gestionpacientes
            path: ms-gestionpacientes
          - name: ms-optimizacion
            path: ms-optimizacion
          - name: ms-notificaciones
            path: ms-notificaciones
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests - ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: ./mvnw test -B

  # ──────────────────────────────────────────────
  # ETAPA 2: Tests Frontend
  # ──────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fullstack-III-EFT-Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Fullstack-III-EFT-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # ──────────────────────────────────────────────
  # ETAPA 3: Build & Push Docker Images a ECR
  # ──────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    strategy:
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
            port: 8080
          - name: ms-auth
            path: ms-auth
            port: 8087
          - name: ms-gestionpacientes
            path: ms-gestionpacientes
            port: 8083
          - name: ms-optimizacion
            path: ms-optimizacion
            port: 8084
          - name: ms-notificaciones
            path: ms-notificaciones
            port: 8085
          - name: frontend
            path: Fullstack-III-EFT-Frontend
            port: 80
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ${{ matrix.service.path }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service.name }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ matrix.service.name }}:latest .
          docker push $ECR_REGISTRY/${{ matrix.service.name }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.service.name }}:latest
          echo "Pushed ${{ matrix.service.name }}:$IMAGE_TAG"

  # ──────────────────────────────────────────────
  # ETAPA 4: Deploy a EKS
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Replace ACCOUNT_ID in K8s manifests
        run: |
          sed -i "s/<ACCOUNT_ID>/${{ secrets.AWS_ACCOUNT_ID }}/g" k8s/*.yml

      - name: Deploy namespace + secrets
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/secrets.yml

      - name: Deploy microservices
        run: |
          kubectl apply -f k8s/ms-notificaciones.yml
          kubectl apply -f k8s/ms-gestionpacientes.yml
          kubectl apply -f k8s/ms-optimizacion.yml
          kubectl apply -f k8s/ms-auth.yml

      - name: Deploy API Gateway
        run: kubectl apply -f k8s/api-gateway.yml

      - name: Deploy Frontend
        run: kubectl apply -f k8s/frontend.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/ms-auth -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/ms-gestionpacientes -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/ms-optimizacion -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/ms-notificaciones -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Get Frontend URL
        run: |
          echo "Waiting for LoadBalancer..."
          sleep 30
          kubectl get svc frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

  # ──────────────────────────────────────────────
  # ETAPA 5: Smoke Test E2E
  # ──────────────────────────────────────────────
  smoke-test:
    name: Smoke Test E2E
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test Gateway health
        run: |
          GW_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=api-gateway -o jsonpath="{.items[0].metadata.name}")
          kubectl exec -n ${{ env.NAMESPACE }} $GW_POD -- curl -sf http://localhost:8080/actuator/health || echo "Gateway health check failed"

      - name: Test ms-auth health
        run: |
          AUTH_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=ms-auth -o jsonpath="{.items[0].metadata.name}")
          kubectl exec -n ${{ env.NAMESPACE }} $AUTH_POD -- curl -sf http://localhost:8087/actuator/health || echo "Auth health check failed"

      - name: Print deployment summary
        run: |
          echo "=========================================="
          echo "  INSFORGE REDNORTE - DEPLOY COMPLETE"
          echo "=========================================="
          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo ""
          FE_URL=$(kubectl get svc frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          GW_URL=$(kubectl get svc api-gateway -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "Frontend URL: http://$FE_URL"
          echo "API Gateway URL: http://$GW_URL"
