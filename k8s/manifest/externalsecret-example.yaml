apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: university/prod/app
        property: DB_PASSWORD

# Ejemplo de inyección (sin hardcodear credenciales en el código):
# 1) AWS Secrets Manager guarda: university/prod/app.DB_PASSWORD
# 2) ExternalSecret crea el Secret Kubernetes "app-secrets"
# 3) El Deployment usa valueFrom.secretKeyRef: {name: app-secrets, key: DB_PASSWORD}

