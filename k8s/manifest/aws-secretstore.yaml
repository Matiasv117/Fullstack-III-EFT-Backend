# SecretStore para AWS Secrets Manager (recomendado con External Secrets)
# Requiere instalar CRD/control-plane de external-secrets en el cluster.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Se asume IAM Role para el servicio (IRSA) del controlador external-secrets.
      # External Secrets leerá credenciales desde el pod.

