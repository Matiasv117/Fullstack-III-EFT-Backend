apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: insforge
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 366092663280.dkr.ecr.us-east-1.amazonaws.com/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: insforge-secrets
                  key: JWT_SECRET
            - name: MS_LISTAS_ESPERA_URL
              value: "http://ms-gestionpacientes:8083"
            - name: MS_NOTIFICACIONES_URL
              value: "http://ms-notificaciones:8085"
            - name: MS_OPTIMIZACION_URL
              value: "http://ms-optimizacion:8084"
            - name: MS_AUTH_URL
              value: "http://ms-auth:8087"
            - name: CORS_ORIGIN
              value: "*"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: insforge
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer
