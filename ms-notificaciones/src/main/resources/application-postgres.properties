# Perfil postgres (activar con SPRING_PROFILES_ACTIVE=postgres). Misma nota Insforge que en los otros MS.
spring.config.activate.on-profile=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ms_notificaciones}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.h2.console.enabled=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.table=flyway_ms_notificaciones
spring.flyway.baseline-on-migrate=true
