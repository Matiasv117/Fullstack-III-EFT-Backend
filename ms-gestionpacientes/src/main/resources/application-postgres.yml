# Perfil postgres: usar con SPRING_PROFILES_ACTIVE=postgres
# Insforge suele exponer UNA base PostgreSQL: usa la misma DB_URL en los 3 microservicios
# (salvo que tengáis un esquema multi-tenant avanzado).
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ms_gestionpacientes}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

