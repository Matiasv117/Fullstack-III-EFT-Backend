server:
  port: ${BFF_SERVER_PORT:8097}

# URL del API Gateway: el BFF llama a los microservicios a través del gateway
# (un solo punto de configuración; en local es http://localhost:8080).
bff:
  downstream:
    base-url: ${BFF_DOWNSTREAM_BASE_URL:http://localhost:8080}
  auth:
    base-url: ${BFF_AUTH_BASE_URL:lb://ms-auth}

spring:
  application:
    name: salud-bff

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: INFO
    com.saludrednorte.bff: DEBUG

# Configuración JWT
jwt:
  secret: miClaveSecretaSuperSeguraParaJWT2024SaludRedNorte
  expiration: 86400000 # 24 horas en milisegundos
